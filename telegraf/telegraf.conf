# Telegraf: MQTT (Tasmota) -> registry tags -> normalize/calibrate/dew point -> InfluxDB
# Also: website checks from the webmon container (web_probe) via an internal HTTP listener

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true
  metric_buffer_limit = 50000    # rides out short InfluxDB restarts
  skip_processors_after_aggregators = false

# Sensor readings: tele/<sensor_id>/SENSOR  {"SHT3X":{"Temperature":..,"Humidity":..},...}
[[inputs.mqtt_consumer]]
  alias = "tasmota_sensor"
  servers = ["tcp://mosquitto:1883"]
  topics = ["tele/+/SENSOR"]
  client_id = "archmon-telegraf-sensor"
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 1
  persistent_session = true
  data_format = "json"
  name_override = "tasmota_sensor"
  json_string_fields = ["Switch1"]   # leak probes: "ON" = water
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tele/+/SENSOR"
    tags = "_/sensor_id/_"

# Device health: tele/<sensor_id>/STATE  {"Wifi":{"RSSI":..,"Signal":..},"UptimeSec":..}
[[inputs.mqtt_consumer]]
  alias = "tasmota_state"
  servers = ["tcp://mosquitto:1883"]
  topics = ["tele/+/STATE"]
  client_id = "archmon-telegraf-state"
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  data_format = "json"
  name_override = "device_state"
  fieldinclude = ["UptimeSec", "Heap", "LoadAvg", "Wifi_RSSI", "Wifi_Signal", "Wifi_LinkCount"]
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tele/+/STATE"
    tags = "_/sensor_id/_"

# Website checks from webmon/webmon.py. Internal Docker network only (port not published); accepts web_probe only.
[[inputs.http_listener_v2]]
  alias = "webmon"
  service_address = ":8186"
  paths = ["/write"]
  methods = ["POST"]
  data_format = "influx"
  namepass = ["web_probe"]
  max_body_size = "1MB"

# Tasmota topic "bldga-f1-vault-01_A1B2C3" -> sensor_id "bldga-f1-vault-01" + device_id "A1B2C3" (MAC suffix)
[[processors.regex]]
  order = 1
  [[processors.regex.tags]]
    key = "sensor_id"
    pattern = '^(.+)_([0-9A-Fa-f]{6})$'
    replacement = "${2}"
    result_key = "device_id"
  [[processors.regex.tags]]
    key = "sensor_id"
    pattern = '^(.+)_([0-9A-Fa-f]{6})$'
    replacement = "${1}"

# Location / room-type / calibration tags from the registry (restart Telegraf after editing)
[[processors.lookup]]
  order = 2
  files = ["/etc/telegraf/registry/sensors.csv"]
  format = "csv_key_values"
  key = '{{.Tag "sensor_id"}}'

# Target bands per room type (registry/room_profiles.csv)
[[processors.lookup]]
  order = 3
  namepass = ["tasmota_sensor"]
  files = ["/etc/telegraf/registry/room_profiles.csv"]
  format = "csv_key_values"
  key = '{{.Tag "room_type"}}'

# Per-room overrides edited from Grafana (registry/room_overrides.csv, tags o_t_min_c ...; blank = room-type value)
[[processors.lookup]]
  order = 4
  namepass = ["tasmota_sensor"]
  files = ["/etc/telegraf/registry/room_overrides.csv"]
  format = "csv_key_values"
  key = '{{.Tag "building"}}|{{.Tag "room"}}'

[[processors.starlark]]
  order = 5
  namepass = ["tasmota_sensor"]
  script = "/etc/telegraf/normalize.star"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TELEGRAF_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET_RAW}"
  tagexclude = ["cal_t", "cal_rh", "installed"]
