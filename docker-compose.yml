# Archival Conditions Monitor - TIG + MQTT stack
# Image versions are pinned; change them deliberately and record in CHANGELOG.md.
# Secrets come from .env (generated on the Pi by scripts/gen-secrets.sh, never committed).

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: archmon-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"            # LAN sensors only (firewall + auth + ACL)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    mem_limit: 128m

  influxdb:
    image: influxdb:2.7.12
    container_name: archmon-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"  # never exposed beyond the Pi
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET_RAW}
      DOCKER_INFLUXDB_INIT_RETENTION: 730d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN}
      INFLUXD_REPORTING_DISABLED: "true"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "268435456"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    mem_limit: 768m

  telegraf:
    image: telegraf:1.40.2
    container_name: archmon-telegraf
    restart: unless-stopped
    command: ["telegraf", "--watch-config", "poll", "--watch-interval", "10s"]   # reload when targets are edited
    depends_on: [mosquitto, influxdb]
    environment:
      MQTT_TELEGRAF_USER: telegraf
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET_RAW: ${INFLUX_BUCKET_RAW}
      INFLUX_TELEGRAF_TOKEN: ${INFLUX_TELEGRAF_TOKEN}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/normalize.star:/etc/telegraf/normalize.star:ro
      - ./registry:/etc/telegraf/registry:ro   # whole folder: the target editor replaces files atomically
    mem_limit: 192m

  grafana:
    image: grafana/grafana:13.2.4
    container_name: archmon-grafana
    restart: unless-stopped
    depends_on: [influxdb]
    # reached through the proxy service on port 3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/archmon-overview.json
      GF_USERS_DEFAULT_THEME: light
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 30d
      GF_HELP_ENABLED: "false"
      GF_PROFILE_ENABLED: "true"
      GF_PLUGINS_PREINSTALL_SYNC: volkovlabs-form-panel@6.3.5   # Business Forms (target editor); pinned
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET_RAW: ${INFLUX_BUCKET_RAW}
      INFLUX_GRAFANA_TOKEN: ${INFLUX_GRAFANA_TOKEN}
      NTFY_GRAFANA_PASSWORD: ${NTFY_GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m

  # Front door: Grafana + target-editor API on one origin (port 3000)
  proxy:
    image: nginx:1.30.6-alpine
    container_name: archmon-proxy
    restart: unless-stopped
    depends_on: [grafana, config]
    ports:
      - "3000:3000"            # staff LAN (firewall); add TLS in proxy/nginx.conf for production
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m

  # Target-range editor API (config/targets_api.py), used by the Grafana "Settings" dashboard. Not published;
  # checks the caller's Grafana session. Only the files it edits are writable; .env is not mounted. It also relays
  # "check/install update" requests from Admins to the host updater (scripts/update.sh) through ./state; no Docker access.
  config:
    image: python:3.12.7-slim-bookworm
    container_name: archmon-config
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-u", "/app/config/targets_api.py"]
    volumes:
      - ./config/targets_api.py:/app/config/targets_api.py:ro
      - /etc/localtime:/etc/localtime:ro      # change-log times in site local time
      - ./scripts/build_dashboards.py:/app/scripts/build_dashboards.py:ro
      - ./registry:/app/registry
      - ./telegraf:/app/telegraf
      - ./grafana/dashboards:/app/grafana/dashboards
      - ./grafana/provisioning/alerting:/app/grafana/provisioning/alerting
      - ./state:/app/state                 # update status/requests shared with scripts/update.sh on the host
    mem_limit: 96m

  ntfy:
    image: binwiederhier/ntfy:v2.31.1
    container_name: archmon-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}   # e.g. http://<pi-address>:8090 (links in notifications)
    ports:
      - "8090:80"              # staff phones on the LAN / Wi-Fi
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./ntfy/templates:/etc/ntfy/templates:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-lib:/var/lib/ntfy
    mem_limit: 128m

  # Website monitor (webmon/webmon.py): downloads images listed in registry/web_targets.csv on a jittered
  # schedule, sends timings to Telegraf (internal listener :8186). Needs outbound internet; no ports, no secrets.
  webmon:
    image: python:3.12.7-slim-bookworm
    container_name: archmon-webmon
    restart: unless-stopped
    user: "1000:1000"
    depends_on: [telegraf]
    command: ["python", "-u", "/app/webmon/webmon.py"]
    volumes:
      - ./webmon/webmon.py:/app/webmon/webmon.py:ro
      - ./registry:/app/registry:ro
    mem_limit: 64m

  # Simulated sensors for demos/testing. Off unless started with:  docker compose --profile sim up -d simulator
  # Remove its data with scripts/sim-clean.sh.
  simulator:
    image: python:3.12.7-slim-bookworm
    container_name: archmon-simulator
    profiles: ["sim"]
    restart: unless-stopped
    depends_on: [mosquitto]
    command: ["python", "-u", "/sim/simulator.py"]
    environment:
      MQTT_USER: sensor
      MQTT_PASSWORD: ${MQTT_SENSOR_PASSWORD}
    volumes:
      - ./sim/simulator.py:/sim/simulator.py:ro
    mem_limit: 64m

volumes:
  ntfy-cache:
  ntfy-lib:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
