# Front door on port 3000: Grafana, plus the target-editor API on the same origin (so the Grafana login cookie
# reaches it). Add TLS here later (listen 443 ssl + certificate) if IT requires HTTPS.
server {
    listen 3000;
    server_tokens off;
    client_max_body_size 1m;
    # Docker DNS, re-resolved at request time so recreated containers (new IPs) are found
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grafana http://grafana:3000;
    set $config http://archmon-config:8095;

    location /archmon-api/ {
        rewrite ^/archmon-api/(.*)$ /$1 break;
        proxy_pass $config;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/live/ {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass $grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
