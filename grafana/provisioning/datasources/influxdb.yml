apiVersion: 1
datasources:
  - name: InfluxDB
    uid: archmon-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET_RAW}
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
